<svg xmlns="http://www.w3.org/2000/svg"
  width="1200" height="340" viewBox="0 0 1200 340"
  role="img" aria-labelledby="title desc">
  <title id="title">Mohamed Youssef — Financial Engineering</title>
  <desc id="desc">Elegant animated GitHub profile banner with quantitative finance motifs.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071827"/>
      <stop offset="52%" stop-color="#0A3345"/>
      <stop offset="100%" stop-color="#0C7A78"/>
      <animate attributeName="x2" values="1;0.78;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="1;0.82;1" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7FE7DC" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#7FE7DC" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="lineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity=".15"/>
      <stop offset="45%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity=".25"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000814" flood-opacity=".45"/>
    </filter>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#BFF7F0" stroke-opacity=".055" stroke-width="1"/>
    </pattern>

    <clipPath id="nameReveal">
      <rect x="0" y="0" width="0" height="90">
        <animate attributeName="width" values="0;670;670" keyTimes="0;.55;1" dur="2.3s" fill="freeze"/>
      </rect>
    </clipPath>

    <path id="curvePath" d="M70 255 C180 205, 270 275, 380 225 S575 188, 690 215 S885 270, 1135 165"/>
  </defs>

  <rect width="1200" height="340" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="26" fill="url(#grid)"/>

  <circle cx="145" cy="60" r="190" fill="url(#glow)" opacity=".28">
    <animate attributeName="cx" values="145;240;145" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="60;85;60" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1070" cy="285" r="240" fill="url(#glow)" opacity=".22">
    <animate attributeName="cx" values="1070;980;1070" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="285;235;285" dur="16s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(76 67)" filter="url(#shadow)">
    <rect width="84" height="84" rx="22" fill="#071B2A" fill-opacity=".62"
      stroke="#9CF3E8" stroke-opacity=".42"/>
    <path d="M24 22V62M24 44L52 22M36 40L58 62"
      fill="none" stroke="#E9FFFC" stroke-width="6"
      stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="64" cy="20" r="4" fill="#7FE7DC">
      <animate attributeName="opacity" values=".25;1;.25" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(195 70)">
    <text x="0" y="62" fill="#FFFFFF"
      font-family="Segoe UI, Arial, sans-serif"
      font-size="60" font-weight="750" letter-spacing=".2"
      clip-path="url(#nameReveal)">Mohamed Youssef </text>

    <rect x="1" y="82" width="92" height="4" rx="2" fill="#77E6D7">
      <animate attributeName="width" values="0;92;92" keyTimes="0;.72;1" dur="2.5s" fill="freeze"/>
    </rect>

    <text x="0" y="120" fill="#CFFAF4"
      font-family="Segoe UI, Arial, sans-serif"
      font-size="22" font-weight="600" letter-spacing=".5" opacity="0">
      Élève ingénieur en Génie Financier · EMSI
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;.42;1" dur="2.5s" fill="freeze"/>
    </text>

    <text x="0" y="158" fill="#A9D9DE"
      font-family="Segoe UI, Arial, sans-serif"
      font-size="17" font-weight="500" letter-spacing=".35">
      Modélisation quantitative  •  Actuariat  •  Aide à la décision
      <animate attributeName="opacity" values=".45;1;.45" dur="7s" repeatCount="indefinite"/>
    </text>
  </g>

  <g>
    <use href="#curvePath" fill="none" stroke="#0A1927" stroke-opacity=".62"
      stroke-width="7" stroke-linecap="round"/>
    <use href="#curvePath" fill="none" stroke="url(#lineGradient)"
      stroke-width="3.2" stroke-linecap="round"
      stroke-dasharray="1200" stroke-dashoffset="1200" filter="url(#softGlow)">
      <animate attributeName="stroke-dashoffset" values="1200;0" dur="3.3s" fill="freeze"/>
    </use>

    <circle r="6" fill="#E8FFFB" stroke="#7FE7DC" stroke-width="3" filter="url(#softGlow)">
      <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
        <mpath href="#curvePath"/>
      </animateMotion>
      <animate attributeName="r" values="5;7;5" dur="1.8s" repeatCount="indefinite"/>
    </circle>

    <g fill="#9CF3E8" stroke="#E9FFFC" stroke-width="1.5">
      <circle cx="206" cy="231" r="5">
        <animate attributeName="opacity" values=".35;1;.35" dur="3.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="444" cy="207" r="5">
        <animate attributeName="opacity" values=".35;1;.35" dur="3.1s" begin=".7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="686" cy="214" r="5">
        <animate attributeName="opacity" values=".35;1;.35" dur="3.1s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="934" cy="238" r="5">
        <animate attributeName="opacity" values=".35;1;.35" dur="3.1s" begin="2.1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <g transform="translate(78 302)"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="12.5" font-weight="650" letter-spacing="1.7"
    fill="#D8FFFA">
    <text x="0" y="0">QUANTITATIVE FINANCE</text>
    <text x="445" y="0">RISK MODELING</text>
    <text x="795" y="0">MULTI-OBJECTIVE OPTIMIZATION</text>
  </g>

  <rect x="1" y="1" width="1198" height="338" rx="25"
    fill="none" stroke="#DFFFFA" stroke-opacity=".13"/>
</svg>
